services:
  - type: web
    name: agentlab-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_MODEL
        value: gemini-2.5-flash
      - key: PROJECT_NAME
        value: AI Voice Agent Studio API
      - key: API_V1_STR
        value: /api/v1
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: /opt/render/project/src/backend/agentlab.db

  - type: web
    name: agentlab-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agentlab-backend.onrender.com/api/v1

